name: hub-gestao

# Arquivo canônico do contêiner do Hub na VPS. A cópia ativa fica em
# /opt/hub-gestao/config/docker-compose.yml (root) e só muda com autorização do Fábio.

services:
  app:
    image: hub-gestao:${HUB_IMAGE_TAG:?HUB_IMAGE_TAG obrigatória}
    container_name: hub-app
    user: "1001:1001"
    env_file:
      - /opt/hub-gestao/shared/.env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      APP_VERSION: ${HUB_IMAGE_TAG}
    init: true
    restart: unless-stopped
    # Retenção dos logs do contêiner (LGPD, M8; docs/privacidade.md): 5 arquivos de 10 MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1001,gid=1001,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      # Rede própria entre o Traefik e o Hub, sem ligação com Hermes ou Certato.
      - hub_proxy
      # Rede do Supabase compartilhado, para falar com o banco (supabase-db:5432).
      - supabase_default

networks:
  hub_proxy:
    external: true
    name: hub_proxy
  supabase_default:
    external: true
    name: supabase_default
